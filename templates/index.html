
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #222;
        }

        h1, h2 {
            color: #17365d;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 15px;
            margin: 5px 0;
            cursor: pointer;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
        }

        input {
            padding: 10px;
            margin: 5px 0;
            max-width: 90%;
        }

        #result, #greeting {
            margin-top: 15px;
            padding: 10px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <h1>Student API Interface</h1>
    <p>Welcome! Use the buttons below to retrieve information from your Flask API.</p>

    <div class="card">
        <h2>Student Information</h2>
        <button onclick="loadStudent()">Load Student Information</button>
        <div id="result"></div>
    </div>

    <div class="card">
        <h2>Greeting API</h2>
        <input type="text" id="nameInput" placeholder="Enter your first name">
        <br>
        <button onclick="sayHello()">Say Hello</button>
        <p id="greeting"></p>
    </div>

    <script>
        function loadStudent() {
            fetch('/student')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerText =
                        'Unable to retrieve student data.';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value.trim();

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('greeting').innerText = data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }
    </script>
</body>
</html>
